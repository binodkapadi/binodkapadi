name: Update Top Contributed Repositories

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/top-contributed-repos.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get top contributed repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: binodkapadi
        run: |
          gh api graphql \
            -f username="$GITHUB_USERNAME" \
            -f query='
              query($username: String!) {
                user(login: $username) {
                  contributionsCollection {
                    commitContributionsByRepository(maxRepositories: 25) {
                      repository {
                        nameWithOwner
                        url
                        name
                        description
                        stargazerCount
                        primaryLanguage {
                          name
                        }
                      }
                      contributions {
                        totalCount
                      }
                    }
                  }
                }
              }
            ' > /tmp/contributions.json

          python3 <<'PY'
          import json
          import re

          with open("/tmp/contributions.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          repos = data["data"]["user"]["contributionsCollection"]["commitContributionsByRepository"]

          repos = sorted(
              repos,
              key=lambda x: x["contributions"]["totalCount"],
              reverse=True
          )[:10]

          lines = [
              "| Repository | Contributions | Stars | Language |",
              "|---|---:|---:|---|"
          ]

          for item in repos:
              repo = item["repository"]
              name = repo["nameWithOwner"]
              url = repo["url"]
              contributions = item["contributions"]["totalCount"]
              stars = repo["stargazerCount"]
              language = (
                  repo["primaryLanguage"]["name"]
                  if repo["primaryLanguage"]
                  else "N/A"
              )

              lines.append(
                  f"| [{name}]({url}) | **{contributions}** | ⭐ {stars} | {language} |"
              )

          table = "\n".join(lines)

          readme_path = "README.md"

          with open(readme_path, "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- TOP-CONTRIBUTED-REPOS:START -->.*?<!-- TOP-CONTRIBUTED-REPOS:END -->"

          replacement = (
              "<!-- TOP-CONTRIBUTED-REPOS:START -->\n"
              + table +
              "\n"
              + "<!-- TOP-CONTRIBUTED-REPOS:END -->"
          )

          readme = re.sub(
              pattern,
              replacement,
              readme,
              flags=re.DOTALL
          )

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit updated contribution data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git commit -m "Update top contributed repositories" || exit 0

          git push
